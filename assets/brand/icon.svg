<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143A2F"/>
      <stop offset="0.55" stop-color="#0A1F19"/>
      <stop offset="1" stop-color="#050E0B"/>
    </linearGradient>
    <radialGradient id="canopy" cx="0.5" cy="0.36" r="0.42">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#6EE7B7" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F5B54A" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="wood" gradientUnits="userSpaceOnUse" x1="0" y1="860" x2="0" y2="240">
      <stop offset="0" stop-color="#0E9F6E"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <radialGradient id="fruit" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFE3A3"/>
      <stop offset="0.45" stop-color="#F5B54A"/>
      <stop offset="1" stop-color="#C46A12"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="236" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="236" fill="url(#canopy)"/>
  <rect x="36" y="36" width="952" height="952" rx="232" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <!-- ground line -->
  <path d="M300 846 H724" stroke="#6EE7B7" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>

  <!-- trunk and boughs drawn as git branch lines -->
  <g fill="none" stroke="url(#wood)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 840 V262"/>
    <path d="M512 700 C512 600 318 610 318 480 V388"/>
    <path d="M512 610 C512 520 706 540 706 420 V330"/>
  </g>

  <!-- commits along the trunk -->
  <g stroke="#6EE7B7" stroke-width="18" fill="#0A1F19">
    <circle cx="512" cy="700" r="30"/>
    <circle cx="512" cy="610" r="30"/>
    <circle cx="512" cy="440" r="30"/>
  </g>

  <!-- fruit: the newest commit on each branch -->
  <g filter="url(#glow)">
    <circle cx="318" cy="364" r="58" fill="url(#fruit)"/>
    <circle cx="512" cy="238" r="64" fill="url(#fruit)"/>
    <circle cx="706" cy="306" r="58" fill="url(#fruit)"/>
  </g>
  <g fill="#FFF6DD" fill-opacity="0.75">
    <circle cx="298" cy="344" r="13"/>
    <circle cx="490" cy="216" r="14"/>
    <circle cx="686" cy="286" r="13"/>
  </g>
</svg>
